[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-radar-mcp"
version = "0.2.0"
description = "Autonomous Tech Radar MCP server with active learning heuristics and token cost optimization detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Serhii Hirus" }
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
adaptive-radar-mcp = "adaptive_radar_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["adaptive_radar_mcp"]

[tool.hatch.build.targets.wheel.sources]
"adaptive_radar_mcp/data" = "adaptive_radar_mcp/data"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
