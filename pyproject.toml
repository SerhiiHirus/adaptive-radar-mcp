[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-radar-mcp"
version = "0.4.0"
description = "Adaptive Tech Radar MCP server with preference weighting and token optimization detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Serhii Hirus" }
]
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.2",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "defusedxml==0.7.1",
    "packaging==26.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[project.scripts]
adaptive-radar-mcp = "adaptive_radar_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["adaptive_radar_mcp"]

[tool.hatch.build.targets.wheel.sources]
"adaptive_radar_mcp/data" = "adaptive_radar_mcp/data"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP006", "UP035", "B008", "B904"]
